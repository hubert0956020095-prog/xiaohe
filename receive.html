<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小鶴彩券行 影片接收站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Huninn&family=Noto+Sans+TC:wght@900&display=swap">
<style>
/* Layout: the shop's red lightbox on top, one card with the pairing code and progress, then the list of received clips. Same night look as the game. */
:root{
  --sky:#0d1230; --sky-2:#1d2350; --red:#d7262e; --red-deep:#9e1820; --yellow:#ffd84a;
  --paper:#fff8e6; --ink:#1d1512; --muted:#c9b79c; --muted-ink:#6f5f4c; --win:#3ddc97;
  --sign-font:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --body:"Huninn","Microsoft JhengHei","PingFang TC",sans-serif;
  --num:"Bungee","Arial Black",Impact,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky),var(--sky-2));color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:32px 48px;display:flex;flex-direction:column;gap:24px}
.sign{align-self:center;background:var(--red);border:4px solid #e9e9ee;border-radius:8px;padding:10px 26px;text-align:center;box-shadow:0 0 30px rgba(215,38,46,.6)}
.sign h1{margin:0;font-family:var(--sign-font);font-weight:900;color:var(--yellow);font-size:clamp(30px,7vw,44px);letter-spacing:.06em;line-height:1.1}
.sign p{margin:2px 0 0;font-size:14px;letter-spacing:.3em}
.card{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.card .k{margin:0;color:var(--muted-ink)}
.code{font-family:var(--num);font-size:clamp(48px,13vw,80px);letter-spacing:.15em;line-height:1;color:var(--red-deep);font-variant-numeric:tabular-nums}
.status{margin:0;font-size:18px}
.bar{width:100%;height:10px;border-radius:99px;background:#eadfc4;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--win);transition:width .3s}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h2{margin:0;font-weight:400;font-size:20px}
h2 span{font-family:var(--num);color:var(--yellow)}
button{font:inherit;border:0;border-radius:99px;padding:8px 18px;background:var(--yellow);color:var(--ink);cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;justify-content:space-between;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(201,183,156,.25);border-radius:10px;padding:8px 12px;min-width:0}
.list a{color:var(--paper);overflow-wrap:anywhere}
.list span{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);margin:0}
.note{color:var(--muted);font-size:14px;margin:0}
</style>
</head>
<body>
<main class="wrap">
  <header class="sign"><h1>小鶴彩券行</h1><p>影片接收站</p></header>

  <section class="card" aria-live="polite">
    <p class="k">在手機遊戲的「影片」→「傳到電腦」輸入這組號碼</p>
    <div class="code" id="code">······</div>
    <p class="status" id="status">準備中…</p>
    <div class="bar"><i id="bar"></i></div>
    <button id="pickDir" type="button">選擇存放資料夾（自動分成中獎／銘謝惠顧）</button>
    <p class="k" id="dirNote">沒選的話，影片會存到「下載」資料夾。</p>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="head"><h2>收到的影片 <span id="count">0</span></h2><button id="again" type="button" hidden>全部再下載一次</button></div>
    <ol class="list" id="list"></ol>
    <p class="empty" id="empty">還沒收到。手機開始傳送後，影片會一段一段出現在這裡。</p>
  </section>

  <p class="note">這個頁面要開著才收得到。每收到一段影片就會自動下載到電腦的「下載」資料夾；如果瀏覽器問「要下載多個檔案嗎」，請按允許。沒有自動下載的話，點上面的檔名也能下載。</p>
</main>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const files = [];
  let peer = null;

  function download(f) {
    const a = document.createElement('a'); a.href = f.url; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  function addRow(f) {
    const li = document.createElement('li'), a = document.createElement('a'), s = document.createElement('span');
    a.href = f.url; a.download = f.name; a.textContent = f.name;
    s.textContent = (f.size / 1048576).toFixed(1) + ' MB';
    li.append(a, s); $('list').prepend(li);
    $('count').textContent = files.length; $('empty').hidden = true; $('again').hidden = files.length < 2;
  }
  $('again').addEventListener('click', () => files.forEach((f, i) => setTimeout(() => download(f), i * 300)));

  // Chrome / Edge on a computer can write straight into a folder: clips are sorted into 中獎\金額, 銘謝惠顧, 進場, 最後結算
  let dir = null;
  if (!window.showDirectoryPicker) { $('pickDir').hidden = true; $('dirNote').textContent = '這個瀏覽器只能存到「下載」資料夾。用 Chrome 或 Edge 可以自動分資料夾。'; }
  $('pickDir').addEventListener('click', async () => {
    try {
      dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'xiaohe' });
      $('dirNote').textContent = `會存到「${dir.name}」，自動分成 中獎（依金額）、銘謝惠顧、進場、最後結算。`;
    } catch (e) { /* closed the picker: keep using Downloads */ }
  });
  function subPathFor(name) {
    const m = name.match(/_中獎NT(\d+)_/);
    if (m) return ['中獎', `${m[1]}元`];
    if (/_銘謝惠顧_/.test(name)) return ['銘謝惠顧'];
    if (/_進場/.test(name)) return ['進場'];
    if (/_最後結算/.test(name)) return ['最後結算'];
    return ['其他'];
  }
  async function saveSorted(name, blob) {
    let d = dir;
    for (const part of subPathFor(name)) d = await d.getDirectoryHandle(part, { create: true });
    let fname = name;
    try { await d.getFileHandle(fname); fname = name.replace(/(\.\w+)$/, `_${Date.now()}$1`); } catch (e) { /* not there yet: good */ }
    const w = await (await d.getFileHandle(fname, { create: true })).createWritable();
    await w.write(blob); await w.close();
  }

  function start() {
    if (!window.Peer) { $('status').textContent = '連不到傳送服務，請確認電腦有網路後重新整理。'; return; }
    const code = String(Math.floor(100000 + Math.random() * 900000));
    $('code').textContent = code;
    $('status').textContent = '連線中…';
    peer = new Peer('xiaohe-' + code);
    peer.on('open', () => { $('status').textContent = '等待手機連線…'; });
    peer.on('error', (e) => {
      if (e.type === 'unavailable-id') { peer.destroy(); start(); return; }   // someone else holds this code: pick another
      if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(e.type)) {
        $('status').textContent = '和傳送服務的連線斷了，正在重連…';
        setTimeout(() => { try { peer.reconnect(); } catch (_) {} }, 2000);
        return;
      }
      $('status').textContent = '出了點問題（' + e.type + '），重新整理這個頁面再試一次。';
    });
    peer.on('disconnected', () => setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (_) {} }, 2000));
    peer.on('connection', (conn) => {
      let finished = false;
      $('status').textContent = '手機連上了！';
      conn.on('data', async (d) => {
        if (!d) return;
        if (d.hello) { $('status').textContent = `手機要傳 ${d.total} 段影片…`; $('bar').style.width = '0'; return; }
        if (d.done) { finished = true; $('status').textContent = '全部收到了！在電腦的「下載」資料夾。'; return; }
        if (d.data) {
          const blob = new Blob([d.data], { type: d.type || 'video/mp4' });
          const f = { name: d.name || ('小鶴彩券行_' + Date.now() + '.mp4'), url: URL.createObjectURL(blob), size: blob.size };
          files.push(f); addRow(f);
          if (dir) { try { await saveSorted(f.name, blob); } catch (e) { download(f); } } else download(f);
          $('bar').style.width = ((d.i + 1) / d.total * 100) + '%';
          $('status').textContent = `收到 ${d.i + 1} / ${d.total}`;
          conn.send({ ack: d.i });
        }
      });
      conn.on('close', () => { if (!finished) $('status').textContent = '手機斷線了。在手機上再按一次「開始傳送」，會接著傳沒傳完的。'; });
    });
  }
  start();
})();
</script>
</body>
</html>
